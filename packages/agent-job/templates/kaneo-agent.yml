name: Kaneo agent
run-name: Kaneo job ${{ inputs.job }}
on:
  workflow_dispatch:
    inputs:
      job:
        description: Kaneo job ID
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: kaneo-agent-${{ inputs.job }}
  cancel-in-progress: false
jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Validate pinned wrapper source
        env:
          KANEO_AGENT_SOURCE_REF: ${{ vars.KANEO_AGENT_SOURCE_REF }}
        run: '[[ "$KANEO_AGENT_SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: usekaneo/kaneo
          ref: ${{ vars.KANEO_AGENT_SOURCE_REF }}
          path: _kaneo
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
          run_install: false
      - name: Build pinned job wrapper
        env:
          HUSKY: '0'
        run: |
          pnpm --dir _kaneo install --frozen-lockfile --filter @kaneo/agent-job...
          pnpm --dir _kaneo/packages/agent-job run build
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repository
          fetch-depth: 0
          persist-credentials: false
      - name: Run approved job
        working-directory: repository
        env:
          KANEO_API_URL: ${{ vars.KANEO_API_URL }}
          KANEO_JOB_ID: ${{ inputs.job }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node ../_kaneo/packages/agent-job/dist/cli.js
