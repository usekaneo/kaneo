name: Notify Discord on new issue

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  notify:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Post to Discord
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
          WEBHOOK: ${{ secrets.DISCORD_ISSUE_WEBHOOK }}
        run: |
          payload=$(jq -nc \
            --arg title "$ISSUE_TITLE" \
            --arg url "$ISSUE_URL" \
            --arg number "$ISSUE_NUMBER" \
            --arg author "$AUTHOR" \
            '{allowed_mentions: {parse: []}, content: "New issue #\($number) by **\($author)**: \($title)\n\($url)"}')
          curl --connect-timeout 5 --max-time 30 -fsS -H "Content-Type: application/json" -d "$payload" "$WEBHOOK"
