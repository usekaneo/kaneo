name: Quills database

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'branding/**'
      - 'pnpm-lock.yaml'
      - 'compose*.yml'
      - 'charts/kaneo/**'
      - '.github/workflows/quills-database.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-and-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_DB: quills_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quills_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      QUILLS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quills_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 12.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@kaneo/api^..." build
      - run: pnpm --filter @kaneo/api test:quills
