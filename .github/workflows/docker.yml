name: Build & publish images to GHCR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing released version to rebuild from its reviewed vX.Y.Z tag"
        required: true
        type: string
      latest:
        description: "Also tag as latest"
        required: false
        type: boolean
        default: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/build-images.yml # zizmor: ignore[self-repository] $/-syntax not parsed by pinned actionlint v1.7.12; revisit when supported
    secrets:
      GH_PACKAGE_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    with:
      source_mode: released
      version: ${{ inputs.version }}
      tags: |
        type=raw,value=${{ inputs.version }}
        type=raw,value=latest,enable=${{ inputs.latest }}
