name: Build & publish images to GHCR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing released version to rebuild from its reviewed vX.Y.Z tag"
        required: true
        type: string
      latest:
        description: "Also tag as latest"
        required: false
        type: boolean
        default: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    secrets: inherit
    with:
      source_mode: released
      version: ${{ inputs.version }}
      tags: |
        type=raw,value=${{ inputs.version }}
        type=raw,value=latest,enable=${{ inputs.latest }}
