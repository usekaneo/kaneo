name: mellon

on:
  # zizmor: ignore[dangerous-triggers] Reviews PR metadata only; never checks out
  # or runs code from the PR.
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: mellon-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  observe:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Flag descriptions for review
        uses: randoneering/mellon@f1bd38cb6f6a7dddabe2d7904921b95fe63dec11
        with:
          token: ${{ github.token }}
          mode: observe
          # Keep these logins aligned with .github/contribution-policy.json.
          allowlist: '["andrejsshell","randoneering","tinsever","MonsPropre","tiran133","renovate[bot]","dependabot[bot]"]'
