name: Auto Assign
on:
  issues:
    types: [opened]
  # zizmor: ignore[dangerous-triggers] Assigns pull requests via the API
  # only; never checks out or executes untrusted code.
  pull_request_target:
    types: [opened]
jobs:
  run:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      issues: write
      pull-requests: write
    steps:
    - name: 'Auto-assign issue'
      uses: pozil/auto-assign-issue@d6e511896e5f1d2408e74db74416647d8ff80c8c # v4.1.0
      with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: aacevski
          numOfAssignee: 1
