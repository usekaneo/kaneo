name: Sync upstream

# Keeps this fork's main current with usekaneo/kaneo. Fork-only changes live on
# main too, so upstream is merged rather than fast-forwarded, and the merge is
# pushed only after the same checks upstream CI runs pass. A conflict or a
# failing check fails the run (GitHub emails the owner) and leaves main
# untouched. Nothing here builds images or deploys: production stays on the
# image tag pinned in dokku-infra until it is changed by hand.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'usekaneo/kaneo'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kaneo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kaneo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_SECRET: test-secret-with-at-least-32-chars
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kaneo_test
      KANEO_API_URL: http://localhost:1337
      KANEO_CLIENT_URL: http://localhost:5173
      DISABLE_GUEST_ACCESS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # GITHUB_TOKEN cannot push commits that touch .github/workflows. Add
          # a FORK_SYNC_TOKEN secret (fine-grained PAT for this repo with
          # Contents and Workflows: read & write) so upstream workflow changes
          # sync too.
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}

      - name: Merge usekaneo/kaneo main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags https://github.com/usekaneo/kaneo.git main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date with upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-edit -m "chore: merge upstream usekaneo/kaneo main" FETCH_HEAD
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.merge.outputs.changed == 'true'
        with:
          version: 10.32.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.merge.outputs.changed == 'true'
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        if: steps.merge.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.merge.outputs.changed == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.merge.outputs.changed == 'true'
        run: pnpm typecheck

      - name: Check translations and OpenAPI
        if: steps.merge.outputs.changed == 'true'
        run: pnpm i18n:check && pnpm openapi:check

      - name: Unit tests
        if: steps.merge.outputs.changed == 'true'
        env:
          NODE_OPTIONS: --no-experimental-webstorage
        run: pnpm test

      - name: API integration tests
        if: steps.merge.outputs.changed == 'true'
        env:
          NODE_ENV: test
        run: pnpm test:integration

      - name: Push the tested merge
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main
