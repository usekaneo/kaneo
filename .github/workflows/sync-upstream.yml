name: Sync upstream

# Keeps this fork's main current with usekaneo/kaneo. Fork-only changes live on
# main too, so upstream is merged rather than fast-forwarded; a conflict fails
# the run (GitHub emails the owner) and leaves main untouched.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'usekaneo/kaneo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # GITHUB_TOKEN cannot push commits that touch .github/workflows. Add
          # a FORK_SYNC_TOKEN secret (fine-grained PAT for this repo with
          # Contents and Workflows: read & write) so upstream workflow changes
          # sync too.
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}

      - name: Merge usekaneo/kaneo main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags https://github.com/usekaneo/kaneo.git main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi
          git merge --no-edit -m "chore: merge upstream usekaneo/kaneo main" FETCH_HEAD
          git push origin HEAD:main
