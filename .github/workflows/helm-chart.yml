name: Build & publish Helm chart to GHCR

on:
  pull_request:
    paths:
      - "charts/kaneo/**"
      - ".github/workflows/helm-chart.yml"
      - ".github/workflows/helm-validate.yml"
  workflow_call:
    inputs:
      version:
        description: "Chart version to publish (blank validates only)"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: "Existing released version to publish from its reviewed vX.Y.Z tag"
        required: true
        type: string

env:
  CHART_PATH: charts/kaneo
  REGISTRY: ghcr.io

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/helm-validate.yml

  publish:
    if: github.ref == 'refs/heads/main' && inputs.version != ''
    runs-on: ubuntu-24.04
    needs: validate
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify publication source
        id: source
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/security/verify-release-source.mjs released "$RELEASE_VERSION"

      - name: Checkout verified release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.source.outputs.source_sha }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Validate the release chart
        run: |
          helm lint "$CHART_PATH" --set kaneo.env.authSecret=validation-only-secret-at-least-32-characters --set kaneo.env.clientUrl=https://kaneo.example.com
          helm template kaneo "$CHART_PATH" --set kaneo.env.authSecret=validation-only-secret-at-least-32-characters --set kaneo.env.clientUrl=https://kaneo.example.com > /dev/null

      - name: Package chart
        run: |
          mkdir -p dist
          helm package "$CHART_PATH" --destination dist

      - name: Log in to GHCR
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | helm registry login "$REGISTRY" --username "$GH_ACTOR" --password-stdin

      - name: Publish chart
        env:
          CHART_VERSION: ${{ inputs.version }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          CHART_REF="oci://$REGISTRY/$OWNER/charts/kaneo"

          if helm show chart "$CHART_REF" --version "$CHART_VERSION" >/dev/null 2>&1; then
            echo "Chart $CHART_REF:$CHART_VERSION already exists; skipping publish."
            exit 0
          fi

          helm push dist/kaneo-"$CHART_VERSION".tgz "oci://$REGISTRY/$OWNER/charts"
