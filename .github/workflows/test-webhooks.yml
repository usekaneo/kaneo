name: Webhook delivery test
on:
  workflow_dispatch:

jobs:
  test:
    name: Ping both webhooks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Ping TRUFFLEHOG_WEBHOOK
        env:
          WEBHOOK_URL: ${{ secrets.TRUFFLEHOG_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::TRUFFLEHOG_WEBHOOK secret is not set on this repository."
            exit 1
          fi
          echo "Posting test message to TRUFFLEHOG_WEBHOOK…"
          payload="$(jq -n \
            --arg url "$RUN_URL" \
            --arg title '✅ TRUFFLEHOG_WEBHOOK test ping' \
            --arg body 'Live delivery test from GitHub Actions. If you see this in the channel, the secret is configured and the webhook is reachable.' \
            '{embeds: [{title: $title, url: $url, color: 15158332, description: $body}]}')"
          if curl --fail --silent --show-error --max-time 15 \
            -H "Content-Type: application/json" \
            --data-binary "$payload" \
            "$WEBHOOK_URL"; then
            echo "OK: TRUFFLEHOG_WEBHOOK accepted the payload"
          else
            echo "::error::TRUFFLEHOG_WEBHOOK POST failed (non-2xx)."
            exit 1
          fi

      - name: Ping ZIZMOR_WEBHOOK
        env:
          WEBHOOK_URL: ${{ secrets.ZIZMOR_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::ZIZMOR_WEBHOOK secret is not set on this repository."
            exit 1
          fi
          echo "Posting test message to ZIZMOR_WEBHOOK…"
          payload="$(jq -n \
            --arg url "$RUN_URL" \
            --arg title '✅ ZIZMOR_WEBHOOK test ping' \
            --arg body 'Live delivery test from GitHub Actions. If you see this in the channel, the secret is configured and the webhook is reachable.' \
            '{embeds: [{title: $title, url: $url, color: 15158332, description: $body}]}')"
          if curl --fail --silent --show-error --max-time 15 \
            -H "Content-Type: application/json" \
            --data-binary "$payload" \
            "$WEBHOOK_URL"; then
            echo "OK: ZIZMOR_WEBHOOK accepted the payload"
          else
            echo "::error::ZIZMOR_WEBHOOK POST failed (non-2xx)."
            exit 1
          fi
