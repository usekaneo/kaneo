name: PR Size Labeler

on:
  # zizmor: ignore[dangerous-triggers] Labels pull requests via the API;
  # checks out only the trusted base-branch size configuration.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-size-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      # Only read trusted base-branch configuration, including for fork PRs.
      - name: Checkout size configuration
        uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/pull-request-size.yml
          sparse-checkout-cone-mode: false

      - name: Label PR based on size
        uses: cbrgm/pr-size-labeler-action@371213a8a3de4b4c8f107ec8adcbb7ca293e970f # v1.4.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repository: ${{ github.repository }}
          github_pr_number: ${{ github.event.pull_request.number }}
          config_file_path: .github/pull-request-size.yml
