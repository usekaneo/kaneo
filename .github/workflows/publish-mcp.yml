name: Publish MCP Package

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - packages/mcp/package.json
      - packages/mcp/server.json

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-mcp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: ${{ github.event_name == 'push' || startsWith(github.event.release.tag_name, 'mcp-v') }}

    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require reviewed release source
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run MCP checks
        run: |
          pnpm --filter @kaneo/mcp test
          pnpm --filter @kaneo/mcp build

      - name: Validate MCP release tag
        if: ${{ github.event_name == 'release' }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/mcp/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#mcp-v}"

          if [ "${GITHUB_REF_NAME}" = "${TAG_VERSION}" ]; then
            echo "Release tag must start with mcp-v, got ${GITHUB_REF_NAME}"
            exit 1
          fi

          if [ "${TAG_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "Release tag version (${TAG_VERSION}) does not match packages/mcp version (${PACKAGE_VERSION})"
            exit 1
          fi

      - name: Check whether @kaneo/mcp version is already published
        id: version_check
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/mcp/package.json').version")

          if npm view "@kaneo/mcp@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "@kaneo/mcp@${PACKAGE_VERSION} is already published; skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @kaneo/mcp
        if: ${{ steps.version_check.outputs.already_published == 'false' }}
        run: |
          cd packages/mcp
          npm publish --access public --provenance

      - name: Create MCP release
        if: ${{ github.event_name == 'push' }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/mcp/package.json').version")

          if gh release view "mcp-v${PACKAGE_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release mcp-v${PACKAGE_VERSION} already exists; skipping."
            exit 0
          fi

          gh release create "mcp-v${PACKAGE_VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "@kaneo/mcp v${PACKAGE_VERSION}" \
            --notes "Published [@kaneo/mcp@${PACKAGE_VERSION}](https://www.npmjs.com/package/@kaneo/mcp/v/${PACKAGE_VERSION}) to npm." \
            --latest=false
        env:
          GH_TOKEN: ${{ github.token }}

  publish-registry:
    needs: publish
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish to the MCP Registry
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(jq -r .version packages/mcp/package.json)
          IN_REGISTRY=$(curl --fail --silent --show-error --max-time 30 \
            "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.usekaneo/kaneo" \
            | jq -er --arg v "$PACKAGE_VERSION" '[.servers[]? | (.server // .) | select(.name == "io.github.usekaneo/kaneo" and .version == $v)] | length')
          if [ "$IN_REGISTRY" != "0" ]; then
            echo "MCP version already registered; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --location --max-time 120 \
            --output "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          cd packages/mcp
          jq --arg v "$PACKAGE_VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish
