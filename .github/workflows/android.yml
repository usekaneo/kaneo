name: Android APK

# Builds a release APK of apps/mobile and uploads it as a workflow artifact. With the signing
# secrets set, the APK is signed with the Kaneo release key, so later builds install as updates.
# Without them (forks, or before the key exists) it falls back to the debug key.

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Android project
        run: pnpm --filter @kaneo/mobile exec expo prebuild --platform android --clean --no-install

      # After prebuild, so the Gradle cache can key on the generated build files.
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Prepare the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with the debug key. This APK can't be updated by a release-signed one."
            echo "SIGNED_WITH=debug" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "KANEO_ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore"
            echo "KANEO_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KANEO_ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "KANEO_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "SIGNED_WITH=release"
          } >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        id: apk
        working-directory: apps/mobile
        run: |
          version=$(node -p 'require("./app.json").expo.version')
          code=$(node -p 'require("./app.json").expo.android.versionCode')
          suffix=""
          [ "$SIGNED_WITH" = "debug" ] && suffix="-debug-signed"
          name="kaneo-${version}-${code}${suffix}"
          mv android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$name.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Built \`$name.apk\` (signed with the $SIGNED_WITH key)." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ runner.temp }}/${{ steps.apk.outputs.name }}.apk
          if-no-files-found: error
          retention-days: 30
