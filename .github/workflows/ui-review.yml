name: Peekareq

on:
  repository_dispatch:
    types: [peekareq]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      model:
        description: OpenRouter vision model
        default: qwen/qwen3.8-flash
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  authorize:
    if: >-
      github.repository == 'usekaneo/kaneo' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' && github.event.sender.login == 'peekareq[bot]'))
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.request.outputs.allowed }}
      pr: ${{ steps.request.outputs.pr }}
      model: ${{ steps.request.outputs.model }}
    steps:
      - uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Verify command and current repository permissions
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ui-review-bot/request.mjs

  screenshots:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    # Only authorized requests enter this group, so outsiders cannot cancel a run.
    concurrency:
      group: peekareq-${{ needs.authorize.outputs.pr }}
      cancel-in-progress: true

    uses: ./.github/workflows/ui-review-run.yml # zizmor: ignore[self-repository] $/-syntax not parsed by pinned actionlint v1.7.12; revisit when supported
    with:
      pr: ${{ needs.authorize.outputs.pr }}
      model: ${{ needs.authorize.outputs.model }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
