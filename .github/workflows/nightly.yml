name: Nightly

on:
  schedule:
    # Runs at 02:17 UTC to avoid the busiest top-of-hour scheduler window.
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan-history:
    name: Full-history secret scan
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          persist-credentials: false
          # The entire-branch scan needs the full commit history.
          fetch-depth: 0
      - name: Scan the full git history for leaked credentials
        run: |
          docker run --rm -v "$PWD:/tmp" -w /tmp \
            ghcr.io/trufflesecurity/trufflehog:v3.97.9 \
            git file:///tmp/ \
            --results=verified,unknown \
            --exclude-paths=.trufflehog-exclude \
            --branch "${{ github.ref_name }}" \
            --fail \
            --sarif > trufflehog-results.sarif
      - name: Upload results to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: trufflehog-results.sarif

  verify:
    name: Verify nightly build
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    uses: ./.github/workflows/ci.yml

  publish-images:
    name: Publish nightly images
    needs: verify
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    secrets: inherit
    with:
      source_mode: nightly
      tags: |
        type=raw,value=nightly
        type=raw,value=nightly-{{date 'YYYYMMDD'}}
        type=sha,prefix=nightly-
