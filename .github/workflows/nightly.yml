name: Nightly

on:
  schedule:
    # Runs at 02:17 UTC to avoid the busiest top-of-hour scheduler window.
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan-history:
    name: Full-history secret scan
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          persist-credentials: false
          # The entire-branch scan needs the full commit history.
          fetch-depth: 0
      - name: Scan the full git history for leaked credentials
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          # Empty base scans every commit on the branch, not just new ones.
          base: ""
          head: ${{ github.ref_name }}
          # Report only verified and unknown results; skip unverified false positives.
          # .trufflehog-exclude allowlists files carrying placeholder credentials
          # (compose examples, docs, generated CONTRIBUTORS.svg, tests).
          extra_args: --results=verified,unknown --exclude-paths=.trufflehog-exclude

  verify:
    name: Verify nightly build
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    uses: ./.github/workflows/ci.yml

  publish-images:
    name: Publish nightly images
    needs: verify
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    secrets: inherit
    with:
      source_mode: nightly
      tags: |
        type=raw,value=nightly
        type=raw,value=nightly-{{date 'YYYYMMDD'}}
        type=sha,prefix=nightly-
