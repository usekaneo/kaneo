name: Build branch images (dev)

# Builds the three container images from selected feature branches and pushes
# them to GHCR under the repository owner's namespace, tagged by branch name and
# commit SHA. This is a development/preview convenience: it is intentionally
# separate from the deliberate, main-only release pipeline (release.yml /
# build-images.yml) and does NOT stamp release versions or move any tags.
#
# Auth uses the built-in GITHUB_TOKEN with packages:write, so no extra secret is
# required; images land at ghcr.io/<owner>/{kaneo,web,api}. Sentry source-map
# upload is intentionally omitted (the web build treats the token as optional).

on:
  push:
    branches:
      - claude/gantt-dependency-lines
      - claude/cross-project-relations
      - claude/gantt-plus-cross-project
      - claude/gantt-pan-zoom
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms (e.g. linux/amd64 or linux/amd64,linux/arm64)"
        required: false
        default: linux/amd64
        type: string

concurrency:
  group: build-branch-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kaneo
            dockerfile: ./Dockerfile.kaneo
            image: ghcr.io/${{ github.repository_owner }}/kaneo
          - name: web
            dockerfile: ./apps/web/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/web
          - name: api
            dockerfile: ./apps/api/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-image cache scope so the parallel matrix legs don't overwrite
          # each other's layers in the shared GitHub Actions cache.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Summarize published tags
        run: |
          {
            echo "### Published \`${{ matrix.name }}\` image"
            echo ""
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Tags:"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
