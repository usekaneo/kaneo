name: AI comment labeler
run-name: "AI comment scan for PR #${{ github.event.pull_request.number || inputs.pull_request_number }}"

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open pull request number
        required: true
        type: string
  # zizmor: ignore[dangerous-triggers] Executes only trusted workflow code;
  # PR blobs are fetched as text through the API and parsed, never executed.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: slop-labeler-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  label:
    if: github.actor != 'dependabot[bot]'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out trusted scanner
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/slop-labeler

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install trusted scanner dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: scripts/slop-labeler

      - name: Reconcile advisory label and message
        # Unavailable or incomplete scans must not block the pull request.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/slop-labeler/check.mjs
