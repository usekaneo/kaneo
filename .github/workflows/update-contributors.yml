name: Update Contributors

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/FUNDING.yml'

jobs:
  update-contributors:
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: read

    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}

    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@v1 # v7.0.1

      - name: Generate Contributors Images
        uses: jaywcjlove/github-action-contributors@86707f6d4c2469ce6b46bc3367253ebd41ee242c # main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filter-author: (renovate\[bot\]|renovate-bot|dependabot\[bot\])
          output: CONTRIBUTORS.svg
          avatarSize: 42

      - name: Generate Sponsors Section
        if: ${{ github.repository_owner == 'usekaneo' }}
        uses: JamesIves/github-sponsors-readme-action@02650b8cd445fc16dfef73195f9c406dce041623 # v1
        with:
          token: ${{ secrets.GH_ANDREJ }}
          file: 'README.md'
          minimum: 1
          marker: sponsors

      - name: Sync Site Sponsors
        if: ${{ github.repository_owner == 'usekaneo' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ANDREJ }}
        run: node apps/site/scripts/sync-sponsors.mjs

      - name: Commit and Push Changes
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add CONTRIBUTORS.svg README.md apps/site/constants/sponsors.json
          if git commit -m "docs: update contributors and sponsors"; then
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-site:
    needs: update-contributors
    if: needs.update-contributors.outputs.pushed == 'true' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      actions: write
    steps:
      - name: Deploy Site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site.yml --repo "$GITHUB_REPOSITORY" --ref main
