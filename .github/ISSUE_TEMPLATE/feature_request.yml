name: Feature request
description: Suggest an improvement to Kaneo
type: Feature
labels: [enhancement]
body:
  - type: textarea
    id: feature
    attributes:
      label: What would you like to change?
      description: Describe the problem, your idea, and how it would help you.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, alternatives, or screenshots if useful.
