version: 2
updates:
  # Keep application updates at the workspace root so Dependabot regenerates
  # the shared lockfile together with package manifests.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    groups:
      # Batch all non-major updates into a single PR to minimise lockfile churn.
      # Major bumps still open individually so they keep getting reviewed.
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # BrowserStack has an independent workspace and lockfile. Root overrides
  # and dependency updates do not reach this test runner.
  - package-ecosystem: "npm"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      browser-test-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
