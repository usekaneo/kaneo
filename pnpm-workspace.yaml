  node-forge@1.4.0: patches/node-forge@1.4.0.patch
  zod@3.25.76: patches/zod@3.25.76.patch
allowBuilds:
  "@prisma/engines": false
  "@sentry/node-cpu-profiler": false
  msw: false
  prisma: false
  bcrypt: true
  better-sqlite3: true
  esbuild: true
catalog:
