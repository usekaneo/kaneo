# Route-derived labels only. Keep resource identifiers and names out of previews.
map $request_uri $kaneo_share_title {
    default "Kaneo - All you need. Nothing you don't.";

    "~^/dashboard/workspace/[^/?]+/project/[^/?]+/task/[^/?]+/?(?:\?.*)?$" "Task · Kaneo";
    "~^/dashboard/workspace/[^/?]+/project/[^/?]+/(?:board)?/?(?:\?.*)?$" "Project board · Kaneo";
    "~^/dashboard/workspace/[^/?]+/project/[^/?]+/backlog/?(?:\?.*)?$" "Project backlog · Kaneo";
    "~^/dashboard/workspace/[^/?]+/project/[^/?]+/calendar/?(?:\?.*)?$" "Project calendar · Kaneo";
    "~^/dashboard/workspace/[^/?]+/project/[^/?]+/gantt/?(?:\?.*)?$" "Project timeline · Kaneo";

    "~^/dashboard/settings/projects(?:/[^/?]+(?:/[^/?]+)?)?/?(?:\?.*)?$" "Project settings · Kaneo";
    "~^/dashboard/settings/workspace(?:/[^/?]+)?/?(?:\?.*)?$" "Workspace settings · Kaneo";
    "~^/dashboard/settings/account(?:/[^/?]+)?/?(?:\?.*)?$" "Account settings · Kaneo";

    "~^/invitation/accept/[^/?]+/?(?:\?.*)?$" "Invitation · Kaneo";
    "~^/(?:dashboard/)?invitations/?(?:\?.*)?$" "Invitations · Kaneo";
    "~^/auth/sign-in/?(?:\?.*)?$" "Sign in · Kaneo";
    "~^/auth/sign-up/?(?:\?.*)?$" "Sign up · Kaneo";
}

# Raw request targets are not HTML-safe. Only reflect conservative RFC 3986
# characters; percent-encoded characters stay encoded and unsafe targets use /.
map $request_uri $kaneo_share_request_uri {
    default "/";
    "~^/[A-Za-z0-9._~!&'()*+,;=:@%/?-]*$" $request_uri;
}

# The client-origin token is replaced at container startup only after strict
# validation. An empty value selects the validated request-host fallback.
map $host $kaneo_configured_origin {
    default "__KANEO_CLIENT_ORIGIN__";
}

map $http_x_forwarded_proto $kaneo_forwarded_scheme {
    default $scheme;
    "~*^[[:space:]]*https[[:space:]]*(?:,|$)" "https";
    "~*^[[:space:]]*http[[:space:]]*(?:,|$)" "http";
}

map $http_host $kaneo_request_origin {
    default "$kaneo_forwarded_scheme://localhost";
    "~^[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?(?::[0-9]{1,5})?$" "$kaneo_forwarded_scheme://$http_host";
    "~^\[[0-9A-Fa-f:.]+\](?::[0-9]{1,5})?$" "$kaneo_forwarded_scheme://$http_host";
}

map $kaneo_configured_origin $kaneo_share_origin {
    default $kaneo_configured_origin;
    "" $kaneo_request_origin;
}
