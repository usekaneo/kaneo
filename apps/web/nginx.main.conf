worker_processes auto;
error_log /dev/stderr warn;
pid /var/lib/kaneo/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /var/lib/kaneo/nginx/client_body;
    proxy_temp_path /var/lib/kaneo/nginx/proxy;
    fastcgi_temp_path /var/lib/kaneo/nginx/fastcgi;
    uwsgi_temp_path /var/lib/kaneo/nginx/uwsgi;
    scgi_temp_path /var/lib/kaneo/nginx/scgi;

    # Seeded from /etc/nginx/conf.d at startup; see runtime-storage.sh.
    include /var/lib/kaneo/nginx/conf.d/*.conf;
}
